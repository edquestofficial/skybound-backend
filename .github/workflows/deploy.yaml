name: Deploy to EC2

on:
  push:
    branches:
      - yogeshbhatt

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      REMOTE_DIR: /home/ubuntu/skybound-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write SSH key
        run: |
          echo "$EC2_SSH_KEY" > key.pem
          chmod 600 key.pem
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

      - name: Copy deploy script to EC2
        run: |
          scp -o StrictHostKeyChecking=no -i key.pem ./deploy.sh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${REMOTE_DIR}/deploy.sh"

      - name: Run deploy script on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "cd ${REMOTE_DIR} && chmod +x deploy.sh && ./deploy.sh main"

      - name: Cleanup key file
        if: always()
        run: rm -f key.pem
